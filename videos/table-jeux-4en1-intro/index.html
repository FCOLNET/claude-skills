<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Anton";
        src: url("assets/fonts/anton-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-latin-800-normal.woff2") format("woff2");
        font-weight: 800;
        font-style: normal;
      }

      :root {
        --yellow: #ffc629;
        --red: #e8433a;
        --green: #2e9a4e;
        --blue: #1f5fa8;
        --paper: #f7f7f2;
        --navy: #0e1a3a;
        --navy-2: #1a2c5c;
        --wood: #6b4226;
        --wood-dark: #4a2c18;
        --muted: #b9c3dd;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--navy);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--navy);
        font-family: "Inter", sans-serif;
        color: var(--paper);
      }

      /* ── background ── */
      #bg {
        position: absolute;
        inset: 0;
      }
      .bg-glow {
        position: absolute;
        inset: -10%;
        background: radial-gradient(circle at 50% 45%, var(--navy-2) 0%, var(--navy) 60%);
      }
      .bg-stripe {
        position: absolute;
        left: -20%;
        right: -20%;
        height: 16px;
        background: var(--yellow);
        opacity: 0.08;
      }
      .bg-stripe.s1 {
        top: 140px;
      }
      .bg-stripe.s2 {
        bottom: 150px;
      }

      .scene {
        position: absolute;
        inset: 0;
      }
      .scene-content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 120px 160px;
        gap: 24px;
      }

      .display {
        font-family: "Anton", sans-serif;
        font-weight: 400;
        text-transform: uppercase;
        line-height: 0.95;
        letter-spacing: 0.01em;
      }

      /* ── scene A: hook ── */
      #a-inner {
        gap: 48px;
      }
      #a-four {
        font-size: 290px;
        line-height: 1.15;
        color: var(--yellow);
      }
      #a-line {
        display: flex;
        gap: 34px;
        font-size: 120px;
        line-height: 1.15;
        color: var(--paper);
      }
      #a-line span {
        display: block;
      }
      #a-line .hl {
        color: var(--yellow);
      }
      #a-underline {
        width: 980px;
        height: 14px;
        border-radius: 7px;
        background: var(--red);
      }

      /* ── scene B: the four games ── */
      #b-inner {
        flex-direction: row;
        justify-content: center;
        gap: 110px;
        padding: 120px 140px;
      }
      #b-table {
        width: 900px;
        height: 560px;
        flex: none;
      }
      #b-table svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .surface {
        transform-box: fill-box;
        transform-origin: 50% 50%;
      }
      #b-side {
        width: 620px;
        display: flex;
        flex-direction: column;
        gap: 44px;
      }
      #b-labels {
        display: grid;
        width: 100%;
        height: 420px;
      }
      .label {
        grid-area: 1 / 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 14px;
      }
      .label .num {
        font-size: 170px;
        color: var(--yellow);
      }
      .label .name {
        font-size: 118px;
        color: var(--paper);
      }
      .label .tag {
        font-size: 38px;
        font-weight: 500;
        color: var(--muted);
      }
      #b-dots {
        display: flex;
        gap: 18px;
      }
      .dot {
        width: 64px;
        height: 12px;
        border-radius: 6px;
        background: var(--navy-2);
      }

      /* ── scene C: resolve ── */
      #c-kicker {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--yellow);
      }
      #c-title {
        font-size: 150px;
        color: var(--paper);
        text-align: center;
      }
      #c-title .hl {
        color: var(--yellow);
      }
      #c-icons {
        display: flex;
        gap: 56px;
        margin-top: 18px;
      }
      .icon {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .icon .badge {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: var(--paper);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon .badge svg {
        width: 96px;
        height: 96px;
      }
      .icon .cap {
        font-size: 30px;
        font-weight: 800;
        color: var(--paper);
      }
      #c-pill {
        margin-top: 30px;
        padding: 20px 52px;
        border-radius: 999px;
        background: var(--yellow);
        color: var(--navy);
        font-size: 46px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <!-- persistent background -->
      <div id="bg" class="clip" data-start="0" data-duration="10" data-track-index="0">
        <div class="bg-glow" id="bg-glow"></div>
        <div class="bg-stripe s1" id="bg-s1"></div>
        <div class="bg-stripe s2" id="bg-s2"></div>

      <!-- Scene A — hook -->
      <div id="scene-a" class="scene clip" data-start="0" data-duration="2" data-track-index="1">
        <div class="scene-content" id="a-inner">
          <div id="a-four" class="display">4 jeux</div>
          <div id="a-line" class="display">
            <span>en</span><span class="hl">1</span><span>seule</span><span>table</span>
          </div>
          <div id="a-underline"></div>
        </div>
      </div>

      <!-- Scene B — the four games -->
      <div id="scene-b" class="scene clip" data-start="2" data-duration="5.4" data-track-index="1">
        <div class="scene-content" id="b-inner">

                <rect x="50" y="50" width="800" height="460" rx="10" fill="#1f5fa8" />
                <g fill="#0b0f1c">
                  <circle cx="62" cy="62" r="26" />
                  <circle cx="450" cy="52" r="24" />
                  <circle cx="838" cy="62" r="26" />
                  <circle cx="62" cy="498" r="26" />
                  <circle cx="450" cy="508" r="24" />
                  <circle cx="838" cy="498" r="26" />

              <!-- 3 · Ping-pong -->
              <g id="surf-3" class="surface">

                <rect x="66" y="66" width="768" height="428" fill="none" stroke="#f7f7f2" stroke-width="8" />

                <rect x="444" y="30" width="12" height="500" fill="#0e1a3a" />
                <line x1="450" y1="30" x2="450" y2="530" stroke="#f7f7f2" stroke-width="3" opacity="0.7" />
                <g>
                  <circle cx="190" cy="390" r="48" fill="#e8433a" />
                  <rect x="178" y="432" width="24" height="60" rx="8" fill="#6b4226" />
                </g>
                <g>
                  <circle cx="710" cy="170" r="48" fill="#0e1a3a" />

              <g id="surf-4" class="surface">

                  <line x1="450" y1="60" x2="450" y2="500" stroke="#e8433a" />
                  <circle cx="450" cy="280" r="78" stroke="#e8433a" />
                  <path d="M50 190 A 110 110 0 0 1 50 370" stroke="#1f5fa8" />

                <rect x="40" y="225" width="16" height="110" fill="#0e1a3a" />

                <g fill="#c7d4e6" opacity="0.8">
                  <circle cx="150" cy="120" r="3" /><circle cx="250" cy="120" r="3" /><circle cx="350" cy="120" r="3" />
                  <circle cx="550" cy="120" r="3" /><circle cx="650" cy="120" r="3" /><circle cx="750" cy="120" r="3" />
                  <circle cx="150" cy="440" r="3" /><circle cx="250" cy="440" r="3" /><circle cx="350" cy="440" r="3" />
                  <circle cx="550" cy="440" r="3" /><circle cx="650" cy="440" r="3" /><circle cx="750" cy="440" r="3" />
                </g>
                <g>
                  <circle cx="190" cy="280" r="40" fill="#e8433a" />
                  <circle cx="190" cy="280" r="18" fill="#b52e27" />

                <g>
                  <circle cx="720" cy="280" r="40" fill="#1f5fa8" />
                  <circle cx="720" cy="280" r="18" fill="#154684" />

            </svg>
          </div>

          <div id="b-side">
            <div id="b-labels">
              <div class="label" id="label-1">
                <div class="num display">01</div>
                <div class="name display">Babyfoot</div>
                <div class="tag">Le classique entre amis</div>
              </div>
              <div class="label" id="label-2">
                <div class="num display">02</div>
                <div class="name display">Billard</div>
                <div class="tag">Précision et stratégie</div>
              </div>
              <div class="label" id="label-3">
                <div class="num display">03</div>
                <div class="name display">Ping-pong</div>
                <div class="tag">Réflexes garantis</div>
              </div>
              <div class="label" id="label-4">
                <div class="num display">04</div>
                <div class="name display">Air hockey</div>
                <div class="tag">Vitesse et fous rires</div>
              </div>
            </div>
            <div id="b-dots">
              <div class="dot" id="dot-1"></div>
              <div class="dot" id="dot-2"></div>
              <div class="dot" id="dot-3"></div>
              <div class="dot" id="dot-4"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Scene C — resolve -->
      <div id="scene-c" class="scene clip" data-start="7.4" data-duration="2.6" data-track-index="1">
        <div class="scene-content" id="c-inner">
          <div id="c-kicker">4 jeux · 1 seule table</div>
          <div id="c-title" class="display">Table de jeux <span class="hl">4 en 1</span></div>
          <div id="c-icons">
            <div class="icon" id="icon-1">
              <div class="badge">
                <svg viewBox="0 0 100 100">
                  <line x1="50" y1="4" x2="50" y2="96" stroke="#9aa3b5" stroke-width="6" />
                  <circle cx="50" cy="30" r="12" fill="#e8433a" />
                  <rect x="38" y="42" width="24" height="30" rx="6" fill="#e8433a" />
                  <circle cx="74" cy="84" r="9" fill="#0e1a3a" />
                </svg>
              </div>
              <div class="cap">Babyfoot</div>
            </div>
            <div class="icon" id="icon-2">
              <div class="badge">
                <svg viewBox="0 0 100 100">
                  <circle cx="50" cy="50" r="40" fill="#0e1a3a" />
                  <circle cx="50" cy="50" r="17" fill="#f7f7f2" />
                  <text x="50" y="58" text-anchor="middle" font-family="Inter" font-weight="800" font-size="22" fill="#0e1a3a">8</text>
                </svg>
              </div>
              <div class="cap">Billard</div>
            </div>
            <div class="icon" id="icon-3">
              <div class="badge">
                <svg viewBox="0 0 100 100">
                  <circle cx="44" cy="42" r="30" fill="#e8433a" />
                  <rect x="54" y="62" width="14" height="34" rx="5" fill="#6b4226" transform="rotate(-40 61 79)" />
                  <circle cx="82" cy="20" r="8" fill="#ff9b2f" />
                </svg>
              </div>
              <div class="cap">Ping-pong</div>
            </div>
            <div class="icon" id="icon-4">
              <div class="badge">
                <svg viewBox="0 0 100 100">
                  <circle cx="40" cy="50" r="30" fill="#1f5fa8" />
                  <circle cx="40" cy="50" r="13" fill="#154684" />
                  <ellipse cx="82" cy="50" rx="12" ry="12" fill="#0e1a3a" />

              </div>
              <div class="cap">Air hockey</div>
            </div>
          </div>
          <div id="c-pill">noumeapascher.nc</div>
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // ── background: slow breath across the whole piece ──
      tl.fromTo("#bg-glow", { scale: 1 }, { scale: 1.08, duration: 10, ease: "sine.inOut" }, 0);
      tl.fromTo("#bg-s1", { x: -120 }, { x: 120, duration: 10, ease: "none" }, 0);
      tl.fromTo("#bg-s2", { x: 120 }, { x: -120, duration: 10, ease: "none" }, 0);

      // ── Scene A: hook (0 → 2s) ──
      tl.fromTo("#a-four", { y: -320, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.45, ease: "power4.out" }, 0.1);
      tl.to("#a-four", { keyframes: [{ x: -12 }, { x: 12 }, { x: -6 }, { x: 0 }], duration: 0.24, ease: "none" }, 0.55);
      tl.fromTo(
        "#a-line span",
        { y: 60, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out", stagger: 0.09 },
        0.7
      );
      tl.fromTo(
        "#a-underline",
        { scaleX: 0, transformOrigin: "left center" },
        { scaleX: 1, duration: 0.4, ease: "power3.out" },
        1.15
      );
      tl.to("#a-inner", { scale: 1.06, autoAlpha: 0, duration: 0.3, ease: "power2.in" }, 1.7);

      // ── Scene B: the four games (2 → 7.4s) — one motif: the surface flips ──
      const B0 = 2.0;
      const SLOT = 1.35;
      tl.fromTo("#b-table", { x: -140, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.5, ease: "power3.out" }, B0);
      tl.fromTo("#b-dots", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, B0 + 0.1);

      for (let i = 1; i <= 4; i++) {
        const s = B0 + (i - 1) * SLOT;
        const surf = "#surf-" + i;
        const label = "#label-" + i;

        if (i === 1) {
          tl.fromTo(surf, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01 }, s);
        } else {
          tl.fromTo(
            surf,
            { autoAlpha: 0, scaleY: 0 },
            { autoAlpha: 1, scaleY: 1, duration: 0.22, ease: "power2.out", immediateRender: true },
            s
          );
        }
        if (i < 4) {
          tl.to(surf, { scaleY: 0, duration: 0.18, ease: "power2.in" }, s + SLOT - 0.18);
        }

        tl.fromTo(label, { y: 50, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: "power3.out" }, s + 0.08);
        if (i < 4) {
          tl.to(label, { y: -40, autoAlpha: 0, duration: 0.2, ease: "power2.in" }, s + SLOT - 0.2);
        }

        tl.fromTo("#dot-" + i, { backgroundColor: "#1a2c5c" }, { backgroundColor: "#ffc629", duration: 0.2 }, s);
      }

      // signature move on each surface
      tl.fromTo("#ball-1", { x: 0, y: 0 }, { x: 250, y: -60, duration: 0.8, ease: "power2.out" }, B0 + 0.35);
      tl.fromTo("#cue-2", { x: -30, y: 10 }, { x: 0, y: 0, duration: 0.2, ease: "power3.in" }, B0 + SLOT + 0.25);
      tl.fromTo("#ball-2", { x: 0 }, { x: 348, duration: 0.55, ease: "power2.out" }, B0 + SLOT + 0.45);
      tl.fromTo(
        "#ball-3",
        { x: 0, y: 0 },
        { keyframes: [{ x: 210, y: -110 }, { x: 420, y: -130 }], duration: 0.8, ease: "sine.inOut" },
        B0 + 2 * SLOT + 0.3
      );
      tl.fromTo("#ball-4", { x: 0 }, { x: 390, duration: 0.6, ease: "power3.out" }, B0 + 3 * SLOT + 0.3);

      tl.to("#b-inner", { scale: 0.96, autoAlpha: 0, duration: 0.3, ease: "power2.in" }, 7.1);

      // ── Scene C: resolve (7.4 → 10s) ──
      tl.fromTo("#c-kicker", { y: 30, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: "power3.out" }, 7.45);
      tl.fromTo("#c-title", { y: 90, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power4.out" }, 7.5);
      tl.fromTo(
        "#c-icons .icon",
        { scale: 0.6, autoAlpha: 0 },
        { scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(2.2)", stagger: 0.1 },
        7.85
      );
