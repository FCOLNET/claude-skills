<title>Réassort proposé</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap">
<style>
/* Layout : un bandeau magasin, une barre de listes, puis des lignes qui se lisent
   de gauche à droite comme une décision — produit, pourquoi, d'où, combien, ce que
   ça rapporte, la réponse du magasin. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --sunk:#e9efed; --ink:#13201f; --muted:#5a6a68; --line:#d5dfdc;
  --accent:#0a6970; --accent-ink:#ffffff; --accent-soft:#dcefee;
  --ok:#1d7a3f; --ok-soft:#dff2e5; --warn:#9a5b00; --warn-soft:#fbeed6; --bad:#b0281f; --bad-soft:#f8e1de;
  --spark:#9fb8b5; --spark-hi:#0a6970;
  --f-ui:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --w-cond:78%; --w-wide:118%;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1716; --surface:#152120; --sunk:#1b2a29; --ink:#e4eeec; --muted:#93a6a3; --line:#2a3b39;
  --accent:#58c2c3; --accent-ink:#062325; --accent-soft:#163536;
  --ok:#6fd08f; --ok-soft:#143022; --warn:#e5a94e; --warn-soft:#33270f; --bad:#ff8d82; --bad-soft:#3a1c19;
  --spark:#3d5654; --spark-hi:#58c2c3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1716; --surface:#152120; --sunk:#1b2a29; --ink:#e4eeec; --muted:#93a6a3; --line:#2a3b39;
  --accent:#58c2c3; --accent-ink:#062325; --accent-soft:#163536;
  --ok:#6fd08f; --ok-soft:#143022; --warn:#e5a94e; --warn-soft:#33270f; --bad:#ff8d82; --bad-soft:#3a1c19;
  --spark:#3d5654; --spark-hi:#58c2c3; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-stretch:var(--w-cond);font-weight:600}

/* bandeau */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:19px;font-weight:750;font-stretch:var(--w-wide);letter-spacing:-.01em}
.brand .date{color:var(--muted);font-size:12px}
.stores{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
.stores button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-weight:550;font-stretch:var(--w-cond);font-size:13.5px}
.stores button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stores .sep{width:1px;background:var(--line);margin:2px 4px}

/* synthèse */
.head{padding-block:22px 6px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr);gap:18px 32px;align-items:end}
.head h2{font-size:clamp(26px,4vw,40px);font-weight:780;font-stretch:var(--w-wide);letter-spacing:-.02em;line-height:1.05}
.head p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:10px 12px;min-width:0}
.kpi b{display:block;font-size:22px;font-weight:720;font-stretch:var(--w-cond);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{color:var(--muted);font-size:12px}
.kpi.ok b{color:var(--ok)} .kpi.bad b{color:var(--bad)}

.rayons{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rayons .lbl{margin-right:4px}
.chip{border:1px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:12.5px;font-stretch:var(--w-cond);font-weight:550}
.chip em{font-style:normal;color:var(--muted);font-weight:450}
.chip[aria-pressed="true"]{border-style:solid;background:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] em{color:inherit;opacity:.8}

/* onglets */
.tabs{margin-top:18px;border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:transparent;padding:10px 12px 9px;border-bottom:3px solid transparent;font-weight:600;font-stretch:var(--w-cond);font-size:14.5px;white-space:nowrap;color:var(--muted)}
.tabs button span{font-weight:450;font-size:12.5px;margin-left:4px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabdesc{color:var(--muted);margin:10px 0 0;max-width:80ch}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:12px}
.filters select,.filters input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 9px;min-width:0}
.filters input[type=search]{flex:1 1 220px;max-width:340px}
.filters .count{margin-left:auto;color:var(--muted);font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;font-stretch:var(--w-cond);font-weight:550}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* lignes */
.list{display:flex;flex-direction:column;gap:6px;padding-bottom:16px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;
  grid-template-columns:minmax(0,2.1fr) minmax(0,2.4fr) minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.5fr);
  gap:10px 16px;padding:11px 14px;align-items:start}
.row.st-ok{border-left:4px solid var(--ok)}
.row.st-ref{border-left:4px solid var(--bad);opacity:.78}
.cell{min-width:0}
.prod b{display:block;font-weight:650;font-size:14.5px;line-height:1.25}
.meta{color:var(--muted);font-size:12px;margin-top:3px}
.meta span+span::before{content:" · "}
.why{font-size:13px}
.why .proof{color:var(--muted);font-size:12px;margin-top:3px}
.tag{display:inline-block;border-radius:4px;padding:0 6px;font-size:11px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;font-stretch:var(--w-cond);vertical-align:1px}
.tag.noel{background:var(--bad-soft);color:var(--bad)}
.tag.new{background:var(--accent-soft);color:var(--accent)}
.spark{display:block;margin-top:5px}
.src{font-size:12.5px}
.src div+div{margin-top:2px}
.src .muted{color:var(--muted)}
.qty label{display:block}
.qty input{width:84px;border:1px solid var(--line);border-radius:var(--r);padding:5px 8px;background:var(--bg);font-weight:650;font-size:15px}
.qty small{display:block;color:var(--muted);font-size:11.5px;margin-top:3px}
.est b{display:block;font-size:15.5px;font-weight:700;font-stretch:var(--w-cond)}
.est small{display:block;color:var(--muted);font-size:12px}
.conf{display:inline-block;margin-top:4px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;font-stretch:var(--w-cond)}
.conf.forte{background:var(--ok-soft);color:var(--ok)} .conf.moyenne{background:var(--warn-soft);color:var(--warn)} .conf.faible{background:var(--sunk);color:var(--muted)}
.act{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 11px;font-weight:600;font-stretch:var(--w-cond)}
.btn.yes{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:3px 8px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.motifs{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;width:100%}
.motifs .btn{font-size:12.5px;padding:4px 8px}
.motifs input{flex:1 1 120px;min-width:0;border:1px solid var(--line);border-radius:var(--r);padding:4px 8px;background:var(--bg)}
.state{font-size:12.5px;text-align:right;width:100%}
.state b{color:var(--ok)} .st-ref .state b{color:var(--bad)}
.state .who{color:var(--muted)}
.claude{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sugg{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--accent-soft);border-radius:var(--r);padding:7px 10px}
.sugg-t{min-width:0}
.sugg .meta{display:inline}
.more{display:flex;justify-content:center;padding:6px 0 20px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.notice{margin-top:12px;border-radius:var(--r);padding:9px 12px;background:var(--warn-soft);color:var(--ink);font-size:13px}
.notice[hidden]{display:none}

/* mes choix et réseau */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-stretch:var(--w-cond);font-weight:650;background:var(--sunk)}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
.bar{display:inline-block;height:8px;border-radius:2px;background:var(--accent);vertical-align:middle;margin-right:6px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}
.panel h3{font-size:15px;font-weight:700;margin:0 0 8px;font-stretch:var(--w-cond)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:12px}
.toolbar .tot{margin-right:auto;color:var(--muted)}
.toolbar .tot b{color:var(--ink)}

details.method{margin:28px 0 40px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);max-width:90ch}
details.method summary{cursor:pointer;color:var(--ink);font-weight:650}
details.method li{margin:4px 0}
.loading{padding:60px 0;color:var(--muted)}

@media (max-width:1100px){
  .row{grid-template-columns:minmax(0,1.6fr) minmax(0,2fr) minmax(0,1fr);}
  .act{justify-content:flex-start}
  .motifs,.state{justify-content:flex-start;text-align:left}
}
@media (max-width:760px){
  .head{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
  .row .prod,.row .why,.row .act{grid-column:1/-1}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .stores{margin-left:0}
}
@media (prefers-reduced-motion:no-preference){.row{transition:border-color .15s,opacity .15s}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Réassort proposé</h1><span class="date" id="dataDate"></span></div>
    <nav class="stores" id="stores" aria-label="Magasin"></nav>
  </div>
</header>

<main class="wrap" id="app">
  <p class="loading" id="loading">Chargement des propositions…</p>
</main>

<script>
(function(){
"use strict";
var NOMS={VILLE:"Ville",DUCOS:"Ducos",CPTION:"Conception",MOTORP:"Motor Pool",APOGOTI:"Apogoti",QLATIN:"Quartier Latin",ENTREPOT:"Entrepôt",GALLIENI:"Gallieni"};
var POS=["0","1","2","3","5","6","7","8"];
var TABS=[
  {id:"RUP",l:"Ruptures",d:"Vous vendiez ces références ces trois derniers mois. Votre stock est à zéro, et l’île en a : entrepôt, réception ou stock qui dort dans un autre magasin."},
  {id:"DEJ",l:"Déjà vendus ici",d:"Vendus chez vous dans les douze derniers mois, plus depuis trois mois, stock à zéro. C’est souvent la saison qui revient : regardez le repère Noël."},
  {id:"ABS",l:"Absents chez moi",d:"Jamais vendus ni stockés chez vous ces douze mois, alors que d’autres magasins les vendent. La vente estimée est celle des autres, ramenée à la taille de votre magasin, puis divisée par deux par prudence."},
  {id:"NOU",l:"Nouveautés",d:"Les références apparues cette année. « Démarrent ailleurs » : d’autres magasins les vendent déjà. « Jamais sorties » : elles sont en réserve et aucun magasin ne les a ; l’estimation vient de produits comparables de la même sous-famille."},
  {id:"SUB",l:"Substitutions",d:"Votre référence est en rupture partout sur l’île. On ne propose un remplaçant que s’il est du même type (même nom de produit, même précision d’usage : un sac à dos pour un sac à dos), à prix voisin. Sinon la rupture est signalée sans proposition ; vous pouvez demander à Claude de chercher un équivalent d’usage parmi le stock d’entrepôt. La vente estimée suppose que la moitié de vos clients accepte le remplaçant."},
  {id:"CED",l:"À céder",d:"Votre stock qui ne tourne pas, alors qu’un autre magasin en a besoin. Accepter, c’est préparer le transfert."},
  {id:"MES",l:"Mes choix",d:"Ce que votre magasin a accepté, prêt à saisir ou à transmettre."}
];
var MOTIFS=["Pas de place","Clientèle non adaptée","Déjà commandé","Prix","Produit / qualité","Autre"];
var REFUS_JOURS=56;
var PAGE=50;

var D=null, state={store:null, tab:"RUP", dept:"", q:"", statut:"todo", tri:"sc", nouv:"all", sub:"all", unit:null, limit:PAGE, openRefus:null};
var decisions={}; // store -> key -> body
var db=null, user=null, canWrite=null, myId=null, profiles={}, dlCap=null, sampleCap=null, claudeRes={};
var nf=new Intl.NumberFormat("fr-FR"), nf1=new Intl.NumberFormat("fr-FR",{maximumFractionDigits:1,minimumFractionDigits:1});
function F(v){ return nf.format(Math.round(v))+" F"; }
function MF(v){ return Math.abs(v)>=1e6 ? nf1.format(v/1e6)+" M F" : nf.format(Math.round(v/1000))+" k F"; }
function nom(code){ var l=D.sites[code]||code; return NOMS[l]||l; }
function token(code){ return (D.sites[code]||code).toLowerCase(); }
function el(tag,cls,txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function art(i){ return D.arts[i]; }
function storeIx(code){ return D.magasins.indexOf(code); }
function keyOf(l){ return (l.g==="CED"?"c":l.g==="RRS"?"r":"a")+art(l.a)[0]; }
function stockAt(a,code){ return a[9][POS.indexOf(code)]; }
function autresMag(a,code){ var t=0; D.magasins.forEach(function(s){ if(s!==code) t+=Math.max(0,stockAt(a,s)); }); return t; }
function reserve(a){ return Math.max(0,a[9][0])+Math.max(0,a[9][7])+Math.max(0,a[12]); }
function dept(a){ return a[2].slice(0,2); }
function try_(f){ try{ return f(); }catch(e){ return null; } }

function statusOf(code,l){
  var d=(decisions[code]||{})[keyOf(l)];
  if(!d) return {s:"todo"};
  if(d.st==="ref" && d.at && (Date.now()-Date.parse(d.at))/864e5>REFUS_JOURS) return {s:"todo",ancien:d};
  return {s:d.st,d:d};
}
function takenElsewhere(code,a){
  var t=0;
  D.magasins.forEach(function(s){ if(s===code) return; var m=decisions[s]; if(!m) return;
    var d=m["a"+a[0]]; if(d && d.st==="ok") t+=d.q||0; });
  return t;
}

/* ---------- chargement ---------- */
fetch("data.json").then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(data){
  D=data; init();
}).catch(function(){
  document.getElementById("loading").textContent="Les données des propositions n’ont pas pu être chargées. Rechargez la page ; si le problème persiste, les données doivent être republiées.";
});

function init(){
  D.idx={}; D.arts.forEach(function(a,i){ D.idx[a[0]]=i; });
  var fin=new Date(D.meta.fin+"T12:00:00");
  document.getElementById("dataDate").textContent="données au "+fin.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
  var h=(location.hash||"").slice(1).toLowerCase(), saved=try_(function(){ return localStorage.getItem("reassort-store"); });
  var byTok={}; D.magasins.forEach(function(s){ byTok[token(s)]=s; }); byTok.reseau="RES";
  state.store=byTok[h]||saved||D.magasins[0];
  if(state.store!=="RES" && D.magasins.indexOf(state.store)<0) state.store=D.magasins[0];
  buildStores(); render(); connect();
  window.addEventListener("hashchange",function(){ var s=byTok[(location.hash||"").slice(1).toLowerCase()]; if(s && s!==state.store){ setStore(s); } });
}
function buildStores(){
  var nav=document.getElementById("stores"); nav.textContent="";
  D.magasins.forEach(function(s){ var b=el("button",null,nom(s)); b.type="button"; b.dataset.s=s; b.onclick=function(){ setStore(s); }; nav.appendChild(b); });
  nav.appendChild(el("span","sep"));
  var r=el("button",null,"Réseau"); r.type="button"; r.dataset.s="RES"; r.onclick=function(){ setStore("RES"); }; nav.appendChild(r);
  syncStores();
}
function syncStores(){ document.querySelectorAll("#stores button").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.s===state.store?"true":"false"); }); }
function setStore(s){
  state.store=s; state.limit=PAGE; state.unit=null; state.openRefus=null;
  try_(function(){ localStorage.setItem("reassort-store",s); });
  var t=s==="RES"?"reseau":token(s); if((location.hash||"").slice(1)!==t) location.hash=t;
  syncStores(); render();
}

/* ---------- décisions partagées ---------- */
function connect(){
  if(!window.claude || !window.claude.use){ notice("Les décisions ne s’enregistrent que dans la page publiée sur claude.ai."); return; }
  window.claude.use("user").then(function(u){ user=u; if(!u) return null;
    return Promise.all([u.id(), u.can("data.write")]).then(function(r){ myId=r[0]; canWrite=r[1]; if(canWrite===false) notice("Vous consultez en lecture seule : pour accepter ou refuser, il faut un accès Contributeur à cette page."); render(); });
  });
  window.claude.use("downloads").then(function(d){ dlCap=d; render(); });
  window.claude.use("sample").then(function(x){ sampleCap=x; render(); });
  window.claude.use("db").then(function(d){
    db=d;
    if(!d){ notice("Les décisions ne peuvent pas être enregistrées dans cette vue : connectez-vous à claude.ai pour accepter ou refuser."); render(); return; }
    D.magasins.forEach(function(s){
      decisions[s]={};
      d.collection("mag/"+s+"/dec").onSnapshot(function(snap){
        var m={}; snap.docs.forEach(function(doc){ m[doc.id]=doc.data(); }); decisions[s]=m; scheduleRender();
      },function(e){ if(e && e.code==="revoked"){ db=null; render(); } });
    });
    render();
  });
}
var pend=null; function scheduleRender(){ if(pend) return; pend=setTimeout(function(){ pend=null; render(); },120); }
var noticeTxt="";
function notice(t){ noticeTxt=t; var n=document.getElementById("notice"); if(n){ n.textContent=t; n.hidden=!t; } }
function writable(){ return !!db && canWrite!==false; }
function decide(code,l,body){
  if(!writable()) return;
  var ref=db.doc("mag/"+code+"/dec/"+keyOf(l));
  var a=art(l.a);
  var full=Object.assign({g:l.g, a:a[0], lib:a[1], by:myId||null, at:new Date().toISOString(), data:D.meta.fin, vm:l.vm}, body);
  (decisions[code]=decisions[code]||{})[keyOf(l)]=full; render();
  ref.set(full).catch(function(e){
    delete decisions[code][keyOf(l)];
    if(e && e.code==="invalid_argument"){ canWrite=false; notice("Votre accès ne permet pas d’enregistrer de décision. Demandez un accès Contributeur à cette page."); }
    else notice("La décision n’a pas été enregistrée ("+(e&&e.code||"erreur")+"). Réessayez.");
    render();
  });
}
function undo(code,l){
  if(!writable()) return;
  var k=keyOf(l), old=decisions[code][k]; delete decisions[code][k]; render();
  db.doc("mag/"+code+"/dec/"+k).delete().catch(function(){ decisions[code][k]=old; notice("L’annulation n’a pas été enregistrée. Réessayez."); render(); });
}

/* ---------- rendu ---------- */
function render(){
  if(!D) return;
  var app=document.getElementById("app"); app.textContent="";
  var n=el("p","notice"); n.id="notice"; n.textContent=noticeTxt; n.hidden=!noticeTxt;
  if(state.store==="RES"){ renderNetwork(app); app.appendChild(n); app.appendChild(method()); return; }
  var code=state.store, L=D.lignes[code];
  var cnt={}, todo=0, ok=0, ref=0, mgTodo=0, mgOk=0;

function exportNetwork(per,motifs,demand,btn){
  var syn=per.map(function(o){ var row=[nom(o.s),D.poids[o.s]];
    ["RUP","DEJ","ABS","NOU","SUB"].forEach(function(g){ var x=o.by[g]||{n:0,ok:0}; row.push(x.n,x.ok); });
    return row.concat([o.n,o.ok,o.ref,Math.round(o.mg),Math.round(o.mgOk),Math.round(o.val)]); });
  var sh=["Magasin","Poids"]; ["Ruptures","Déjà vendus","Absents","Nouveautés","Substitutions"].forEach(function(t){ sh.push(t+" proposées",t+" acceptées"); });
  sh=sh.concat(["Total proposées","Total acceptées","Total refusées","Marge possible (F HT)","Marge acceptée (F HT)","Engagé (F PR)"]);
  var decs=[];
  D.magasins.forEach(function(s){ D.lignes[s].forEach(function(l){ if(statusOf(s,l).s!=="todo") decs.push(propRow(s,l)); });
    mine(s).forEach(function(x){ if(x.l.via==="claude" && !D.lignes[s].some(function(m){ return m.a===x.l.a && m.g!=="RRS"; })) decs.push(propRow(s,x.l)); }); });
  var mo=Object.keys(motifs).sort(function(x,y){ return motifs[y]-motifs[x]; }).map(function(m){ return [m,motifs[m]]; });
  var di=Object.keys(demand).map(function(c){ var x=demand[c], a=art(x.a); return [a[0],a[1],x.q,reserve(a),x.q-reserve(a),x.s.map(nom).join(", ")]; })
    .filter(function(r){ return r[4]>0; }).sort(function(x,y){ return y[4]-x[4]; });
  saveXlsx("reassort-reseau-"+D.meta.fin+".xlsx",[
    {n:"Synthèse",h:sh,r:syn,w:sh.map(function(h,i){ return i===0?14:12; })},
    {n:"Décisions",h:PH,r:decs,w:PW},
    {n:"Motifs de refus",h:["Motif","Refus"],r:mo,w:[30,10]},
    {n:"Stock disputé",h:["Code","Article","Accepté","Stock entrepôt","Écart","Magasins"],r:di,w:[9,40,10,10,10,40]}],btn);
}

/* ---------- méthode ---------- */
function method(){
  var P=D.meta.params, d=el("details","method"); d.appendChild(el("summary",null,"Comment les propositions sont calculées"));
  var ul=el("ul");
  ["Seul compte le stock présent sur l’île. « Stock entrepôt » regroupe l’entrepôt, Gallieni (qui ne vend pas) et la réception à deux jours. Le stock des autres magasins est affiché, mais seul celui qui y dort ou y est en surstock est proposé en transfert : on ne vide pas un magasin qui vend. Ce qui est en commande ou en mer est signalé, jamais proposé.",
   "Tous les magasins reçoivent toutes les propositions, quelle que soit leur taille. La taille ne sert qu’à estimer : la vente d’un autre magasin est ramenée au poids du vôtre.",
   "Vente estimée : ventes des 12 derniers mois divisées par le nombre de mois où l’article était présent. Si votre stock est à zéro, on compte jusqu’à la dernière vente, pour ne pas confondre rupture et absence de demande.",
   "Quantité proposée : environ "+P.couv+" jours de vente estimée. Depuis l’entrepôt elle est arrondie au sous-colis, qui ne se divise pas ; un transfert entre magasins se fait à l’unité. Modifiez-la avant d’accepter.",
   "Marge estimée : ce qui se vendrait en "+P.horizon+" mois (au plus la quantité proposée) × (prix de vente hors TGC − prix de revient). Le taux de TGC de chaque article est lu dans ses ventes.",
   "Absents chez moi et nouveautés : vente des autres magasins × "+P.prudence+" par prudence.",
   "Substitution : seulement quand un produit du même type est en entrepôt. Le type, ce sont les mots du libellé qu’emploient plusieurs fournisseurs (« sac », « étagère », « pare-soleil »), sans les couleurs, matières, tailles ni marques. Le remplaçant a le même mot de tête ; si les deux précisent leur usage (« sac à dos », « étagère chaussures »), la précision doit se retrouver ; hors de la sous-famille, il faut deux mots en commun. Prix entre "+Math.round(P.prix_sub[0]*100)+" % et "+Math.round(P.prix_sub[1]*100)+" % de l’original. Vente estimée : celle de l’original × "+P.report+". Sans remplaçant sûr, la rupture est signalée sans proposition ; Claude peut chercher un équivalent d’usage, à votre demande.",
   "Stock qui dort : aucune vente en 12 mois dans le magasin, et pas de livraison récente de l’entrepôt (plus de "+P.dort+" jours). Surstock : plus de "+P.surstock+" jours de couverture ; le cédant garde "+P.garde+" jours de ses propres ventes.",
   "Nouveauté : aucune vente sur l’île l’an dernier, ni avant les six derniers mois. « Jamais sortie » : reçue à l’entrepôt il y a moins de "+P.nvd+" jours, aucun magasin ne l’a.",
   "Rayon absent : vendu par au moins "+P.rayon_min+" autres magasins, ni vente ni stock chez vous, et quelque chose en réserve.",
   "Un refus sort la ligne de la liste pendant "+REFUS_JOURS/7+" semaines ; elle revient ensuite si elle est toujours valable. Une référence n’apparaît qu’une fois par magasin, dans la liste la plus sûre.",
   "Sources : "+D.meta.fichiers.base+", "+D.meta.fichiers.analyse+" ("+D.meta.periode+"), "+D.meta.fichiers.glissant+"."
  ].forEach(function(t){ ul.appendChild(el("li",null,t)); });
  d.appendChild(ul); return d;
}
})();
